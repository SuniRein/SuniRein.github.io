><!--[-->编译器优化<!--]--><!----></a><!--]--></div><div class="create-time" data-v-859fda45><span class="icon vpi-clock" data-v-859fda45></span><span data-v-859fda45>2026-04-03</span></div></div><div class="vp-doc excerpt" data-v-859fda45><p>Niche 优化是 Rust 编译器的一种内存优化技术。

</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-3249f653 data-v-859fda45><!----><div class="post-item-content" data-v-859fda45><h3 data-v-859fda45><!----><!----><!----><a class="vp-link link" href="/blog/4iizatfo/" data-v-859fda45><!--[-->从 Nginx 到 Caddy：配置简化与自动 HTTPS 的魅力<!--]--><!----></a></h3><div class="post-meta" data-v-859fda45><div class="category-list" data-v-859fda45><span class="icon vpi-folder" data-v-859fda45></span><!--[--><!--[--><a class="vp-link link no-icon" href="/blog/categories/?id=e9a3d2" data-v-859fda45><!--[-->网站建设<!--]--><!----></a><!----><!--]--><!--]--></div><div class="reading-time" data-v-859fda45><span class="vpi-books icon" data-v-859fda45></span><span data-v-859fda45>约 900 字</span><span data-v-859fda45>3 分钟</span></div><div class="tag-list" data-v-859fda45><span class="icon vpi-tag" data-v-859fda45></span><!--[--><a class="vp-link link tag vp-tag-q2sj" href="/blog/tags/?tag=建站" data-v-859fda45><!--[-->建站<!--]--><!----></a><a class="vp-link link tag vp-tag-bhyk" href="/blog/tags/?tag=Caddy" data-v-859fda45><!--[-->Caddy<!--]--><!----></a><a class="vp-link link tag vp-tag-31a6" href="/blog/tags/?tag=Nginx" data-v-859fda45><!--[-->Nginx<!--]--><!----></a><!--]--></div><div class="create-time" data-v-859fda45><span class="icon vpi-clock" data-v-859fda45></span><span data-v-859fda45>2025-10-13</span></div></div><div class="vp-doc excerpt" data-v-859fda45><p>前不久我的云服务器快到期了，重新买了台新的服务器，但是原来的 Nginx 配置文件比较复杂，迁移起来麻烦，而且证书自动续期也得重新配置。</p>
<p>在查阅资料时，我发现了 Caddy 这个轻量级的 Web 服务器，配置文件简洁明了，内置自动 HTTPS 功能，非常适合个人和小型项目使用。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-3249f653 data-v-859fda45><!----><div class="post-item-content" data-v-859fda45><h3 data-v-859fda45><!----><!----><!----><a class="vp-link link" href="/blog/mc9zsqkp/" data-v-859fda45><!--[-->Rust Option 类型方法详解<!--]--><!----></a></h3><div class="post-meta" data-v-859fda45><div class="category-list" data-v-859fda45><span class="icon vpi-folder" data-v-859fda45></span><!--[--><!--[--><a class="vp-link link no-icon" href="/blog/categories/?id=63362f" data-v-859fda45><!--[-->Rust 语法基础<!--]--><!----></a><!----><!--]--><!--]--></div><div class="reading-time" data-v-859fda45><span class="vpi-books icon" data-v-859fda45></span><span data-v-859fda45>约 2545 字</span><span data-v-859fda45>8 分钟</span></div><div class="tag-list" data-v-859fda45><span class="icon vpi-tag" data-v-859fda45></span><!--[--><a class="vp-link link tag vp-tag-3bb9" href="/blog/tags/?tag=Rust" data-v-859fda45><!--[-->Rust<!--]--><!----></a><a class="vp-link link tag vp-tag-rhul" href="/blog/tags/?tag=Rust std" data-v-859fda45><!--[-->Rust std<!--]--><!----></a><!--]--></div><div class="create-time" data-v-859fda45><span class="icon vpi-clock" data-v-859fda45></span><span data-v-859fda45>2025-10-05</span></div></div><div class="vp-doc excerpt" data-v-859fda45><p><code v-pre>Option</code> 和 <code v-pre>Result</code> 是 Rust 中最常接触的几个类型。

与传统的二叉树不同，B 树通过多分支和高扇出的特性，显著减少磁盘 I/O 次数，从而高效管理海量数据。
本文将系统讲解 B 树的核心设计思想、平衡维护机制及其关键操作（查找、插入、删除），
探讨 B 树的适用场景，帮助读者理解其在大规模存储系统中的核心地位。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-3249f653 data-v-859fda45><!----><div class="post-item-content" data-v-859fda45><h3 data-v-859fda45><!----><!----><!----><a class="vp-link link" href="/blog/mdyrqsgl/" data-v-859fda45><!--[-->Splay 树<!--]--><!----></a></h3><div class="post-meta" data-v-859fda45><div class="category-list" data-v-859fda45><span class="icon vpi-folder" data-v-859fda45></span><!--[--><!--[--><a class="vp-link link no-icon" href="/blog/categories/?id=e010e2" data-v-859fda45><!--[-->数据结构与算法精讲<!--]--><!----></a><!----><!--]--><!--]--></div><div class="reading-time" data-v-859fda45><span class="vpi-books icon" data-v-859fda45></span><span data-v-859fda45>约 2267 字</span><span data-v-859fda45>8 分钟</span></div><div class="tag-list" data-v-859fda45><span class="icon vpi-tag" data-v-859fda45></span><!--[--><a class="vp-link link tag vp-tag-bhyk" href="/blog/tags/?tag=数据结构" data-v-859fda45><!--[-->数据结构<!--]--><!----></a><a class="vp-link link tag vp-tag-q2sj" href="/blog/tags/?tag=平衡树" data-v-859fda45><!--[-->平衡树<!--]--><!----></a><a class="vp-link link tag vp-tag-hbu9" href="/blog/tags/?tag=自适应数据结构" data-v-859fda45><!--[-->自适应数据结构<!--]--><!----></a><!--]--></div><div class="create-time" data-v-859fda45><span class="icon vpi-clock" data-v-859fda45></span><span data-v-859fda45>2025-02-01</span></div></div><div class="vp-doc excerpt" data-v-859fda45><p>在本文中，我将介绍 Splay 树，一种与 <VPLink href="AVL%E6%A0%91.md">AVL 树</VPLink>类似但有所不同的自适应二叉查找树。
与 AVL 树通过严格平衡因子维护树的高度不同，Splay 树通过伸展操作将最近访问的节点移动到根节点，从而自适应地优化频繁访问的数据。
这种灵活性使得 Splay 树在缓存、数据压缩等场景中表现优异。
本文将详细讲解 Splay 树的核心原理、操作实现及其与 AVL 树的异同，帮助读者深入理解这一自平衡树结构的独特优势。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-3249f653 data-v-859fda45><!----><div class="post-item-content" data-v-859fda45><h3 data-v-859fda45><!----><!----><!----><a class="vp-link link" href="/blog/dnnlipz6/" data-v-859fda45><!--[-->AVL 树<!--]--><!----></a></h3><div class="post-meta" data-v-859fda45><div class="category-list" data-v-859fda45><span class="icon vpi-folder" data-v-859fda45></span><!--[--><!--[--><a class="vp-link link no-icon" href="/blog/categories/?id=e010e2" data-v-859fda45><!--[-->数据结构与算法精讲<!--]--><!----></a><!----><!--]--><!--]--></div><div class="reading-time" data-v-859fda45><span class="vpi-books icon" data-v-859fda45></span><span data-v-859fda45>约 1540 字</span><span data-v-859fda45>5 分钟</span></div><div class="tag-list" data-v-859fda45><span class="icon vpi-tag" data-v-859fda45></span><!--[--><a class="vp-link link tag vp-tag-bhyk" href="/blog/tags/?tag=数据结构" data-v-859fda45><!--[-->数据结构<!--]--><!----></a><a class="vp-link link tag vp-tag-q2sj" href="/blog/tags/?tag=平衡树" data-v-859fda45><!--[-->平衡树<!--]--><!----></a><!--]--></div><div class="create-time" data-v-859fda45><span class="icon vpi-clock" data-v-859fda45></span><span data-v-859fda45>2025-01-21</span></div></div><div class="vp-doc excerpt" data-v-859fda45><p>在本文中，我将详细介绍 AVL 树这一自平衡二叉查找树的基本概念、核心原理以及其操作过程，
